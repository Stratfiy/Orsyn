name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids `api` and `web` are the required status checks for branch protection.
# Keep them stable. No path filters, so both always report.
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check . ../../evals
      - run: uv run ruff check . ../../evals --config pyproject.toml
      - run: uv run mypy
      - run: uv run pytest
      # Fake provider, no network, no cost.
      - run: uv run python ../../evals/runner.py --suite _smoke

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web format
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  # deploy-dev: DISABLED PLACEHOLDER (E0). Not built yet; documented so the shape is reviewed now.
  #
  # Switching it on is a separate PR labelled needs-founder: replace `if: false` with
  # `if: github.event_name == 'push' && github.ref == 'refs/heads/main'` and add
  # `permissions: id-token: write` at job level. A hard-coded `if: false` (not a repo
  # variable) is deliberate so enabling goes through review.
  #
  # What it will do, on push to main only:
  #   1. aws-actions/configure-aws-credentials via OIDC
  #      (role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}, aws-region: ap-south-1).
  #      No access keys, ever.
  #   2. aws-actions/amazon-ecr-login.
  #   3. Build and push orsyn-api (and orsyn-web, depending on the web hosting decision,
  #      E0 Q6) images tagged with ${{ github.sha }}.
  #   4. aws-actions/amazon-ecs-render-task-definition, then
  #      aws-actions/amazon-ecs-deploy-task-definition to the ECS Fargate dev cluster
  #      with wait-for-service-stability: true.
  #   5. curl the dev /health and check that `version` equals the commit SHA.
  #
  # Prerequisites (each a later story, each needs-founder):
  #   - AWS account
  #   - GitHub OIDC provider and a deploy role restricted to
  #     repo:<org>/Orsyn:environment:dev
  #   - ECR repositories
  #   - ECS cluster and services
  #   - Dockerfiles
  #   - a GitHub `dev` environment
  #
  # Pin every aws-actions step to a full commit SHA with a version comment, like above.
  deploy-dev:
    if: false # E0: disabled until AWS account exists. Enabling is a needs-founder PR.
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    steps:
      - run: echo "deploy-dev is disabled in E0"
