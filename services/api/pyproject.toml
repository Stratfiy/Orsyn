[project]
name = "orsyn-api"
version = "0.0.0"
description = "Orsyn API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"../../evals/**/test_*.py" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests", "../../evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
